apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-db2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg2
  template:
    metadata:
      labels:
        app: pg2
    spec:
      containers:
      - name: postgres
        image: postgres:14
        env:
        - name: POSTGRES_PASSWORD
          value: 'LJJshuwi1233'
        - name: POSTGRES_DB
          value: 'database2'
        - name: POSTGRES_USER
          value: app_user
        ports:
        - containerPort: 5432

---
apiVersion: v1
kind: Service
metadata:
  name: pg2-svc
spec:
  selector:
    app: pg2
  ports:
  - port: 5432
    targetPort: 5432
